apply plugin: 'com.android.application'

android {
    compileSdkVersion 27
    buildToolsVersion '30.0.2'

    defaultConfig {
        applicationId 'top.ximin.epdwallpaper'
        minSdkVersion 27
        targetSdkVersion 27
        versionCode 12
        versionName '1.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lintOptions {
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
}
