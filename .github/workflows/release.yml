name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify tag matches app version
        shell: bash
        run: |
          app_version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          if [[ "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$app_version" >&2
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-27" "build-tools;30.0.2"

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "6.7.1"

      - name: Restore stable signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          if [[ -z "$ANDROID_SIGNING_KEY_BASE64" ]]; then
            echo "ANDROID_SIGNING_KEY_BASE64 is not configured" >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify release signature
        shell: bash
        run: |
          expected="de99936d10a3db746cd4aa02fc9c019178749c33614482d2ecd409799e4a897d"
          actual=$("$ANDROID_HOME/build-tools/30.0.2/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected signing certificate: $actual" >&2
            exit 1
          fi

      - name: Name release APK
        id: package
        shell: bash
        run: |
          apk="EpdWallpaperManager-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.package.outputs.apk }}"
          --verify-tag
          --title "EpdWallpaperManager $GITHUB_REF_NAME"
          --generate-notes
